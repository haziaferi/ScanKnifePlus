name: Build ScanKnife+

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Signing is skipped (and the unsigned APK uploaded) when the repository has no signing key secret.
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
    steps:
    - uses: actions/checkout@v4

    - name: Set SOURCE_DATE_EPOCH
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV
    
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "build-tools;34.0.0"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.8
        cache-disabled: true

    - name: Build Release APK and AAB
      run: |
        gradle clean :scanner-core:test :app:testDebugUnitTest assembleRelease bundleRelease --stacktrace --no-daemon --console=plain

    - name: Sign and Zipalign
      if: env.HAS_SIGNING_KEY == 'true'
      run: |
        # Locate tools
        ZIPALIGN=$ANDROID_HOME/build-tools/34.0.0/zipalign
        APKSIGNER=$ANDROID_HOME/build-tools/34.0.0/apksigner
        
        # Zipalign
        $ZIPALIGN -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-aligned.apk
        
        # Sign
        echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks
        $APKSIGNER sign --ks keystore.jks \
          --ks-key-alias "${{ secrets.ALIAS }}" \
          --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
          --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
          --out app/build/outputs/apk/release/ScanKnife+.apk \
          app/build/outputs/apk/release/app-release-aligned.apk
        
        # Cleanup
        rm keystore.jks

    - name: Log APK Size
      run: |
        echo "=== RELEASE APK SIZE ==="
        ls -lh app/build/outputs/apk/release/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: ScanKnifePlus-Release-APK${{ env.HAS_SIGNING_KEY != 'true' && '-unsigned' || '' }}
        path: app/build/outputs/apk/release/${{ env.HAS_SIGNING_KEY == 'true' && 'ScanKnife+.apk' || 'app-release-unsigned.apk' }}

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: ScanKnifePlus-Release-AAB
        path: app/build/outputs/bundle/release/app-release.aab
