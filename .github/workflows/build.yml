name: Build ScanKnife+

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Signing is skipped (and the unsigned APK uploaded) when the repository has no signing key secret.
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "build-tools;36.0.0"

    # Validates the wrapper jar; caches are written only from the default branch.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Test, lint and build release APK and AAB
      run: |
        ./gradlew :scanner-core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest assembleRelease bundleRelease --stacktrace --no-daemon --console=plain

    # AGP's unsigned APK is already aligned (CameraX .so files at 16 KB); re-running zipalign -v 4 could break that.
    - name: Sign APK
      if: env.HAS_SIGNING_KEY == 'true'
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        KEY_ALIAS: ${{ secrets.ALIAS }}
        KS_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      run: |
        BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0
        trap 'rm -f keystore.jks' EXIT
        printf '%s' "$SIGNING_KEY" | base64 -d > keystore.jks
        $BUILD_TOOLS/apksigner sign --ks keystore.jks \
          --ks-key-alias "$KEY_ALIAS" \
          --ks-pass env:KS_PASS \
          --key-pass env:KEY_PASS \
          --out app/build/outputs/apk/release/ScanKnife+.apk \
          app/build/outputs/apk/release/app-release-unsigned.apk
        $BUILD_TOOLS/zipalign -c -P 16 -v 4 app/build/outputs/apk/release/ScanKnife+.apk

    - name: Log APK Size
      run: |
        echo "=== RELEASE APK SIZE ==="
        ls -lh app/build/outputs/apk/release/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: ScanKnifePlus-Release-APK${{ env.HAS_SIGNING_KEY != 'true' && '-unsigned' || '' }}
        path: app/build/outputs/apk/release/${{ env.HAS_SIGNING_KEY == 'true' && 'ScanKnife+.apk' || 'app-release-unsigned.apk' }}

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: ScanKnifePlus-Release-AAB
        path: app/build/outputs/bundle/release/app-release.aab
