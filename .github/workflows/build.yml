name: Build ScanKnife+

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Signing is skipped (and the unsigned APK and AAB uploaded) when the repository has no signing key secret.
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "build-tools;36.0.0 platforms;android-37.0"

    # Validates the wrapper jar; caches are written only from the default branch.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Test, lint and build release APK and AAB
      run: |
        ./gradlew :scanner-core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest assembleRelease --stacktrace --no-daemon --console=plain
        # The bundle is built without ABI splits (app/build.gradle.kts), so in its own run.
        ./gradlew bundleRelease -PnoAbiSplits --stacktrace --no-daemon --console=plain

    # AGP's unsigned APK is already aligned (CameraX .so files at 16 KB); re-running zipalign -v 4 could break that.
    - name: Sign APK and AAB
      if: env.HAS_SIGNING_KEY == 'true'
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        KEY_ALIAS: ${{ secrets.ALIAS }}
        KS_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      run: |
        BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0
        trap 'rm -f keystore.jks' EXIT
        printf '%s' "$SIGNING_KEY" | base64 -d > keystore.jks
        # Releases ship one APK per ABI (the universal APK is for debugging): app-<abi>-release-unsigned.apk is signed as ScanKnife+-<abi>.apk.
        for APK in app/build/outputs/apk/release/app-*-release-unsigned.apk; do
          case "$APK" in *-universal-*) continue ;; esac
          ABI=${APK#app/build/outputs/apk/release/app-}
          OUT=app/build/outputs/apk/release/ScanKnife+-${ABI%-release-unsigned.apk}.apk
          $BUILD_TOOLS/apksigner sign --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "$OUT" "$APK"
          $BUILD_TOOLS/zipalign -c -P 16 -v 4 "$OUT"
        done
        # App bundles are JAR-signed; apksigner does not sign them.
        jarsigner -keystore keystore.jks -storepass:env KS_PASS -keypass:env KEY_PASS \
          -signedjar app/build/outputs/bundle/release/ScanKnife+.aab \
          app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
        # Checked against the keystore (a self-signed key has no CA chain, which bare -strict rejects); jarsigner still exits 0 on an
        # unsigned bundle, so the "jar verified." line is required too.
        VERIFY=$(jarsigner -verify -strict -keystore keystore.jks -storepass:env KS_PASS \
          app/build/outputs/bundle/release/ScanKnife+.aab "$KEY_ALIAS")
        printf '%s\n' "$VERIFY"
        printf '%s\n' "$VERIFY" | grep -qx 'jar verified\.'

    - name: Log APK Size
      run: |
        echo "=== RELEASE APK SIZE ==="
        ls -lh app/build/outputs/apk/release/*.apk

    - name: Upload Release APKs
      uses: actions/upload-artifact@v4
      with:
        name: ScanKnifePlus-Release-APKs${{ env.HAS_SIGNING_KEY != 'true' && '-unsigned' || '' }}
        path: |
          app/build/outputs/apk/release/${{ env.HAS_SIGNING_KEY == 'true' && 'ScanKnife+-*.apk' || 'app-*-release-unsigned.apk' }}
          !app/build/outputs/apk/release/*universal*

    - name: Upload Release AAB
      uses: actions/upload-artifact@v4
      with:
        name: ScanKnifePlus-Release-AAB${{ env.HAS_SIGNING_KEY != 'true' && '-unsigned' || '' }}
        path: app/build/outputs/bundle/release/${{ env.HAS_SIGNING_KEY == 'true' && 'ScanKnife+.aab' || 'app-release.aab' }}
