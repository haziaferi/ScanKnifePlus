[versions]
agp = "9.3.3"
kotlin = "2.4.21"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activity = "1.13.0"
composeBom = "2026.09.00"
pdfbox = "2.0.27.0"
coil = "2.7.0"
junit = "4.13.2"
junitVersion = "1.3.0"
robolectric = "4.16.1"
exifinterface = "1.4.2"
# Matches androidx.test:monitor 1.8.0, which Robolectric 4.16.1 brings onto the unit-test classpath.
androidxTestCore = "1.7.0"
# Held on the 1.5 line (1.5.3 is its last release): 1.6 moves camera-camera2 onto the CameraPipe backend, a separate migration.
camerax = "1.5.3"
# Brings androidx.test:runner 1.7.0 (AndroidJUnitRunner); same androidx.test release as ext:junit 1.3.0.
androidxTestRules = "1.7.0"
# The OpenMP variant: multi-threaded, faster with a single Tesseract instance on multi-core phones (fork README).
tesseract4android = "4.12.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
tesseract4android-openmp = { group = "com.github.haziaferi.Tesseract4Android", name = "tesseract4android-openmp", version.ref = "tesseract4android" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
